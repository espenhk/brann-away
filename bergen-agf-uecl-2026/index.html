<script>
(async()=>{
const K='brann:key',kdf=JSON.parse(document.getElementById('kdf').textContent),
enc=JSON.parse(document.getElementById('enc').textContent),
b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
get=()=>{try{return sessionStorage.getItem(K)||localStorage.getItem(K)}catch(e){return null}},
put=(v,rem)=>{try{sessionStorage.setItem(K,v);if(rem)localStorage.setItem(K,v)}catch(e){}},
drop=()=>{try{sessionStorage.removeItem(K);localStorage.removeItem(K)}catch(e){}};
async function open(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(enc.iv)},key,b(enc.ct)))}
function show(h){document.open();document.write(h);document.close()}
const saved=get();
if(saved){try{return show(await open(b(saved)))}catch(e){drop()}}
const f=document.getElementById('f');f.hidden=false;
f.onsubmit=async ev=>{ev.preventDefault();const err=document.getElementById('err');err.textContent='Åpner…';
try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveBits']);
const raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(kdf.salt),iterations:kdf.iter},base,256));
const h=await open(raw);put(btoa(String.fromCharCode(...raw)),document.getElementById('rem').checked);show(h)}
catch(e){err.textContent='Feil passord'}}})();
</script></body></html>
